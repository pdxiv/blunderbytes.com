{{define "content"}}
<div class="articles-container">
    <h1>Create a New Blog Entry</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" maxlength="200" required><br><br>
        <label for="content">Content (markdown):</label><br>
        <textarea id="content" name="content" rows="12" cols="60" maxlength="20000" required></textarea><br><br>
        <label for="file">Attach an Image:</label>
        <input type="file" id="file" name="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" required><br><br>
        <input type="submit" value="Create Blog Entry">
    </form>
</div>
{{end}}
